services:
  valeo-wms:
    build: .
    image: disyfa/valeo-wms:latest
    container_name: valeo-wms
    env_file:
      - ./.env
    environment:
      - DB_HOST=host.docker.internal
      # Used if you dont have local postgres
      # - DB_HOST=valeo-wms-postgres
      # - DB_DATABASE=valeo-wms
      # - DB_USERNAME=root
      # - DB_PASSWORD=root
    ports:
      - "8000:80"
    volumes:
      - ./storage/app/public:/app/storage/app/public
  
